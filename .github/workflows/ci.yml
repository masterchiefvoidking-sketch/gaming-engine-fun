name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential g++-12 ninja-build \
            libvulkan-dev vulkan-tools mesa-vulkan-drivers \
            libx11-dev libxrandr-dev libxi-dev libxxf86vm-dev libxcb1-dev \
            libwayland-dev wayland-protocols pkg-config libxkbcommon-dev \
            libxinerama-dev libxcursor-dev libgl1-mesa-dev \
            clang-format

      - name: Check formatting
        run: |
          find engine tests apps -name '*.cpp' -o -name '*.hpp' | xargs clang-format --dry-run --Werror

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++-12 -DEVE_BUILD_EDITOR=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        env:
          EVE_SKIP_GRAPHICAL_TESTS: "1"
        run: ctest --test-dir build --output-on-failure
